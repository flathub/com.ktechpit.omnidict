app-id: com.ktechpit.omnidict
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: omnidict
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - /share/doc

modules:
  - name: omnidict
    buildsystem: cmake-ninja
    subdir: app
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DOMNIDICT_BUILD_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/keshavbhatt/omnidict.git
        tag: v1.1.0
        commit: ecd4cf21601b80da2b7acf45b3ff9a58a37f7469
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
